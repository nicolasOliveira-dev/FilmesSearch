<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaísesSearch - Pesquisa e Cadastro de Países</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Overlay -->
    <div class="background-grid-overlay">
        <div class="dark-gradient-cover"></div>
    </div>

    <!-- Header Navigation -->
    <header class="header">
        <div class="container header-content">
            <a href="#" class="brand-logo">
                <div class="logo-icon">
                    <i class="fa-solid fa-earth-americas"></i>
                </div>
                <span class="brand-name">Países<span class="highlight">Search</span></span>
            </a>

            <!-- Toggle Acervo Button -->
            <button id="toggleCatalogBtn" class="btn-acervo-toggle">
                <i class="fa-solid fa-globe"></i>
                <span>Ver Países Cadastrados</span>
                <span id="navCountryCountBadge" class="nav-count-badge">0</span>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="main-content container">
        <!-- Search & Filter Section -->
        <section class="search-section">
            <div class="search-box-group">
                <!-- Text Search Input -->
                <div class="search-input-wrapper">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Pesquisar por nome do país ou capital..." 
                        autocomplete="off"
                    >
                    <button type="button" id="clearSearchBtn" class="clear-btn hidden" title="Limpar pesquisa">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <!-- Continent Filter Dropdown -->
                <div class="search-genre-wrapper">
                    <select id="searchContinentFilter">
                        <option value="">Todos os Continentes</option>
                        <option value="África">África</option>
                        <option value="América do Norte">América do Norte</option>
                        <option value="América do Sul">América do Sul</option>
                        <option value="Antártida">Antártida</option>
                        <option value="Ásia">Ásia</option>
                        <option value="Europa">Europa</option>
                        <option value="Oceania">Oceania</option>
                    </select>
                    <i class="fa-solid fa-chevron-down select-icon"></i>
                </div>
            </div>
        </section>

        <!-- Form Heading & Card Section -->
        <section class="collaborate-section">
            <h1 class="section-title">Cadastre e Pesquise Países pelo Mundo</h1>
            <p class="section-subtitle">Adicione novos países ao acervo informando o continente, a capital e a população estimada.</p>
            
            <div class="form-card">
                <div class="card-accent-bar"></div>
                <form id="addCountryForm" class="country-form">
                    <div class="form-grid">
                        <!-- Nome do País -->
                        <div class="form-group">
                            <label for="countryName"><i class="fa-solid fa-flag"></i> Nome do País</label>
                            <input 
                                type="text" 
                                id="countryName" 
                                name="nome" 
                                placeholder="Digite o nome do país (ex: Brasil, Japão)..." 
                                required
                            >
                        </div>

                        <!-- Continente -->
                        <div class="form-group">
                            <label for="countryContinent"><i class="fa-solid fa-compass"></i> Continente</label>
                            <div class="select-wrapper">
                                <select id="countryContinent" name="continente" required>
                                    <option value="" disabled selected>Selecione um continente</option>
                                    <option value="África">África</option>
                                    <option value="América do Norte">América do Norte</option>
                                    <option value="América do Sul">América do Sul</option>
                                    <option value="Antártida">Antártida</option>
                                    <option value="Ásia">Ásia</option>
                                    <option value="Europa">Europa</option>
                                    <option value="Oceania">Oceania</option>
                                </select>
                                <i class="fa-solid fa-chevron-down select-icon"></i>
                            </div>
                        </div>

                        <!-- Capital -->
                        <div class="form-group">
                            <label for="countryCapital"><i class="fa-solid fa-building-columns"></i> Capital</label>
                            <input 
                                type="text" 
                                id="countryCapital" 
                                name="capital" 
                                placeholder="Digite a capital (ex: Brasília, Tóquio)..." 
                                required
                            >
                        </div>

                        <!-- População Estimada -->
                        <div class="form-group">
                            <label for="countryPopulation"><i class="fa-solid fa-users"></i> População Estimada</label>
                            <input 
                                type="text" 
                                id="countryPopulation" 
                                name="populacao" 
                                placeholder="Ex: 214 milhões ou 214.000.000" 
                                required
                            >
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="form-actions">
                        <button type="submit" class="btn-submit">
                            <i class="fa-solid fa-plus"></i>
                            <span>Cadastrar País</span>
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <!-- Country Catalog Results Grid (Visible on click or search) -->
        <section class="catalog-section hidden" id="catalogSection">
            <div class="catalog-header">
                <h2>Países Cadastrados no Acervo <span id="countryCountBadge" class="count-badge">0</span></h2>
                <button id="closeCatalogBtn" class="close-catalog-btn" title="Fechar acervo">
                    <i class="fa-solid fa-xmark"></i> Fechar
                </button>
            </div>

            <!-- List of Country Cards -->
            <div class="country-list" id="countryList">
                <!-- Country cards rendered dynamically -->
            </div>

            <div id="noResults" class="no-results hidden">
                <i class="fa-solid fa-earth-americas"></i>
                <p id="noResultsText">Nenhum país cadastrado ainda. Utilize o formulário acima para cadastrar!</p>
            </div>
        </section>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">
        <i class="toast-icon fa-solid fa-circle-check"></i>
        <span id="toastMessage">País cadastrado com sucesso!</span>
    </div>

    <!-- Script -->
    <script src="script.js"></script>
</body>
</html>
